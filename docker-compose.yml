services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tcgcoach
      POSTGRES_USER: tcgcoach
      POSTGRES_PASSWORD: tcgcoach
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tcgcoach"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: packages/api
      dockerfile: Dockerfile
    ports:
      - "3002:3001"
    environment:
      DATABASE_URL: postgres://tcgcoach:tcgcoach@postgres:5432/tcgcoach
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      LOG_DIR: /app/data/logs
      PORT: 3001
      REDIS_URL: redis://redis:6379
      # Required for LLM coaching - set ANTHROPIC_API_KEY in your environment
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - ./data/logs:/app/data/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: packages/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3002
    ports:
      - "3080:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3002
      API_URL: http://api:3001
    depends_on:
      - api

volumes:
  postgres_data:
